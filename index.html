<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apploqic - Business Directory</title>
    <meta name="description" content="Apploqic Business Directory - Professional business management solutions">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            animation: fadeInUp 1s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        
        .tagline {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
        }
        
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .link-btn {
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .secondary-btn {
            background: transparent;
            color: #667eea;
            border-color: #667eea;
        }
        
        .secondary-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .footer-text {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }
        
        @media (max-width: 600px) {
            .logo-container {
                margin: 20px;
                padding: 40px 30px;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .links {
                flex-direction: column;
                align-items: center;
            }
            
            .link-btn {
                width: 200px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">APPLOQIC</div>
        <div class="tagline">Business Directory Platform</div>
        <div class="subtitle">Professional business management solutions for the modern world</div>
        
        <div class="links">
            <a href="documentation/interactive-api-docs.html" class="link-btn primary-btn">API Documentation</a>
            <a href="test/run-tests.html" class="link-btn secondary-btn">Test Suite</a>
        </div>
        
        <div class="footer-text">
            &copy; 2025 Apploqic. All rights reserved.
        </div>
    </div>
</body>
</html>
